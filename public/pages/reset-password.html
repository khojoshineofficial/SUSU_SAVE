<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · SUSU SAVE</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth">
    <section class="auth-brand">
      <a class="auth-logo" href="/" style="color:inherit">
        <span class="mark">SS</span>
        <span><span class="name">SUSU SAVE</span><br><span class="tag">Save Together, Grow Together.</span></span>
      </a>
      <div class="auth-pitch">
        <h1>Choose a new password.</h1>
        <p>Pick something you have not used elsewhere — at least 8 characters with letters and numbers.</p>
      </div>
      <p class="small" style="color:rgba(255,255,255,0.65)">© <span id="year"></span> SUSU SAVE</p>
    </section>

    <section class="auth-form-wrap">
      <div id="theme-slot"></div>
      <form class="auth-form" id="form" method="post" action="#" novalidate>
        <h2>Reset password</h2>
        <p class="sub">Set a new password for your account.</p>

        <div class="auth-error"></div>
        <div class="auth-success"></div>

        <div class="field">
          <label for="password">New password</label>
          <input class="input" id="password" type="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input class="input" id="confirmPassword" type="password" autocomplete="new-password" required>
        </div>

        <button class="btn btn-lg btn-block" type="submit">Update password</button>
        <p class="auth-alt"><a href="/login">Back to sign in</a></p>
        <div class="credit" style="padding-top:28px">
          Developed by <span class="dev">Kenneth Nartey</span> —
          <a href="tel:+233555563413">0555563413</a> / <a href="tel:+233203208934">0203208934</a>
        </div>
      </form>
    </section>
  </div>

  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
