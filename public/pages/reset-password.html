<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · SUSU SAVE</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth">
    <section class="auth-brand">
      <a class="auth-logo" href="/" style="color:inherit">
        <span class="mark">SS</span>
        <span><span class="name">SUSU SAVE</span><br><span class="tag">Save Together, Grow Together.</span></span>
      </a>
      <div class="auth-pitch">
        <h1>Choose a new password.</h1>
        <p>Pick something you have not used elsewhere — at least 8 characters with letters and numbers.</p>
      </div>
      <p class="small" style="color:rgba(255,255,255,0.65)">© <span id="year"></span> SUSU SAVE</p>
    </section>

    <section class="auth-form-wrap">
      <form class="auth-form" id="form" novalidate>
        <h2>Reset password</h2>
        <p class="sub">Set a new password for your account.</p>

        <div class="auth-error"></div>
        <div class="auth-success"></div>

        <div class="field">
          <label for="password">New password</label>
          <input class="input" id="password" type="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input class="input" id="confirmPassword" type="password" autocomplete="new-password" required>
        </div>

        <button class="btn btn-lg btn-block" type="submit">Update password</button>
        <p class="auth-alt"><a href="/login">Back to sign in</a></p>
      </form>
    </section>
  </div>

  <script type="module">
    import { api, showError, showSuccess, submitting, clearMessages } from '/js/auth.js';
    document.getElementById('year').textContent = new Date().getFullYear();

    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) showError('This reset link is missing its token. Request a new link from the sign-in page.');

    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessages();
      const password = document.getElementById('password').value;
      if (password !== document.getElementById('confirmPassword').value) {
        showError('The two passwords do not match.');
        return;
      }

      const button = event.target.querySelector('button');
      const restore = submitting(button, 'Updating…');
      try {
        await api.post('/auth/reset-password', { token, password });
        showSuccess('Password updated. Redirecting you to sign in…');
        setTimeout(() => { window.location.href = '/login'; }, 1600);
      } catch (err) {
        showError(err.message);
        restore();
      }
    });
  </script>
</body>
</html>
